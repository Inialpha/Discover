# CI for pull requests into main.
#   - Backend tests run only when backend files changed; the front-end checks only when frontend files changed.
#   - The "CI gate" job always runs and is the ONE check to require in the branch protection rule. It passes when every
#     job that was needed passed (or was correctly skipped) and fails if any failed. This avoids the usual trap where a
#     required check that never ran (because of a path filter) leaves the pull request waiting forever.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]   # after a merge, check main itself
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            files=$(git ls-files)   # push to main / manual run: check everything
          fi
          echo "Changed files:"; echo "$files"
          # workflow edits re-run both so a broken CI file is caught
          echo "backend=$(echo "$files" | grep -qE '^(backend/|\.github/workflows/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(echo "$files" | grep -qE '^(frontend/|\.github/workflows/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest

  frontend:
    name: Front-end checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # package-lock.json is not tracked in this repo, so there is nothing to cache on and `npm ci` cannot run
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  gate:
    name: CI gate
    needs: [changes, backend, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Everything that had to run passed
        run: |
          echo "changes=${{ needs.changes.result }} backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }}"
          for r in "${{ needs.changes.result }}" "${{ needs.backend.result }}" "${{ needs.frontend.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then echo "A required job did not pass"; exit 1; fi
          done
