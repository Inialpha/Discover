# Alembic command line (run from backend/): alembic upgrade head | alembic revision --autogenerate -m "message" | alembic current
# The database is DATABASE_URL (see .env.example). The migrations live in discover/api/migrations and also run when the API starts.
[alembic]
script_location = discover/api/migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
