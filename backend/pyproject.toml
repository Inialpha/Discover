[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discover-backend"
version = "0.2.0"
description = "Discover: persona and audience discovery grounded in Qloo taste data (engine + API)"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.7",
  "email-validator>=2.1",
  "pyjwt>=2.8",
  "python-pptx>=1.0",
  "python-docx>=1.1",
  "pillow>=10.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
discover = "discover.engine.cli:main"

[tool.setuptools.packages.find]
include = ["discover*"]

[tool.setuptools.package-data]
"discover.engine.personas" = ["data/*.json"]
"discover.api.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore:.*HMAC key.*"]
