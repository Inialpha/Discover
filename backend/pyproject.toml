[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discover-backend"
version = "0.1.0"
description = "Discover: agentic cultural-intelligence workflow (business / market discovery first)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
discover = "discover.cli:main"

[tool.setuptools.packages.find]
include = ["discover*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
