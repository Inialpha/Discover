# Render blueprint for the API. The database is external (Neon etc.); set DATABASE_URL in the dashboard.
services:
  - type: web
    name: discover-api
    runtime: python
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn discover.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: QLOO_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_DELAY_SECONDS
        value: "8"
